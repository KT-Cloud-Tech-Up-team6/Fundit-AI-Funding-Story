[project]
name = "fundit-ai-funding-story"
version = "0.3.0"
description = "Funding Story AI API and durable generation worker"
requires-python = ">=3.12,<3.13"
dependencies = [
 "fastapi>=0.115",
 "uvicorn[standard]>=0.30",
 "pydantic-settings>=2",
 "langgraph==1.2.11",
 "langgraph-checkpoint-postgres>=3",
 "google-genai>=1",
 "openai>=3.17,<4",
 "psycopg[binary,pool]>=3.2",
 "httpx>=0.28",
 "pillow>=11",
 "playwright>=1.55,<2",
]
[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.12", "testcontainers[postgres]==4.15.0"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff]
target-version = "py312"
line-length = 110
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/funding_story"]
