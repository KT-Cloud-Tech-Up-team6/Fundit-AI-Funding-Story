name: AI contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AI_SERVICE_TOKEN: ci-only
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/install_font.py
      - run: uv run python scripts/check_langgraph_migrations.py
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
      - run: uv build

  verify-image:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --platform linux/amd64 --tag "fundit-ai-funding-story:pr-${GITHUB_SHA}" .

      - name: Build migration image
        run: docker build --platform linux/amd64 --file Dockerfile.migration --tag "fundit-ai-funding-story:pr-${GITHUB_SHA}-migration" .
      - name: Verify migration image on PostgreSQL 16
        run: bash scripts/verify_migration_image.sh "fundit-ai-funding-story:pr-${GITHUB_SHA}-migration"

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      ECR_REPOSITORY: fundit-ai-funding-story
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --platform linux/amd64 --tag "fundit-ai-funding-story:${IMAGE_TAG}" .
      - name: Build migration image
        run: docker build --platform linux/amd64 --file Dockerfile.migration --tag "fundit-ai-funding-story:${IMAGE_TAG}-migration" .
      - name: Verify migration image on PostgreSQL 16
        run: bash scripts/verify_migration_image.sh "fundit-ai-funding-story:${IMAGE_TAG}-migration"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::899957568205:role/fundit-ai-funding-story-ci-role
          aws-region: ap-northeast-2
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker tag "fundit-ai-funding-story:${IMAGE_TAG}" "$image_uri"
          docker push "$image_uri"
          printf 'Image: `%s`\nPlatform: `linux/amd64`\nCommit: `%s`\n' "$image_uri" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Push migration image and record immutable reference
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}-migration"
          docker tag "fundit-ai-funding-story:${IMAGE_TAG}-migration" "$image_uri"
          docker push "$image_uri"
          immutable_uri=$(docker image inspect "$image_uri" --format '{{index .RepoDigests 0}}')
          test -n "$immutable_uri"
          printf 'Migration image: `%s`\nDigest reference: `%s`\nPlatform: `linux/amd64`\nCommit: `%s`\n' \
            "$image_uri" "$immutable_uri" "$GITHUB_SHA" | tee migration-image.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: migration-image
          path: migration-image.txt
