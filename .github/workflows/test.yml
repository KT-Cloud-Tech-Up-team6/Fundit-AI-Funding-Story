name: AI contracts
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: funding_ai
          POSTGRES_PASSWORD: local-ai-only
          POSTGRES_DB: funding_ai
        ports: ['55432:5432']
        options: >-
          --health-cmd="pg_isready -U funding_ai"
          --health-interval 3s --health-retries 20
    env:
      AI_SERVICE_TOKEN: ci-only
      DATABASE_URL: postgresql://funding_ai:local-ai-only@localhost:55432/funding_ai
      TEST_DATABASE_URL: postgresql://funding_ai:local-ai-only@localhost:55432/funding_ai
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/install_font.py
      - run: uv run python -m funding_story.store
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
      - run: uv build
