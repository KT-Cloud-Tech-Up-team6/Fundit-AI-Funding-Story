name: AI contracts
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AI_SERVICE_TOKEN: ci-only
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/install_font.py
      - run: uv run python scripts/check_langgraph_migrations.py
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
      - run: uv build
